# Windows instalacija Hospes POS-a: na svaki push na main (ili ručno, „Run workflow“) GitHub na Windows računaru
# pokrene sve testove i napravi .msi sa ugrađenom Javom. Paket se preuzima sa stranice tog pokretanja (Artifacts).
name: Windows instalacija

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  msi:
    name: Testovi i .msi
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Testovi na Windows-u
        run: ./gradlew.bat build

      - name: Instalacioni paket (.msi)
        run: ./gradlew.bat :app:packageMsi

      - name: Sačuvaj .msi
        uses: actions/upload-artifact@v4
        with:
          name: hospes-pos-windows
          path: app/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Izveštaji testova (samo ako nešto padne)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: izvestaji-testova
          path: "**/build/reports/tests/**"
          retention-days: 7
